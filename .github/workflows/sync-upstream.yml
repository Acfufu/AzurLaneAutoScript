name: Sync upstream content

# Weekly auto-merge of LmeSzinc/master (content/code upstream) into master.
# Clean merges push directly as github-actions[bot]; conflicts abort and open
# a PR for manual resolution instead. Joxos integration updates are NOT
# automated — follow them by hand (see README lineage).

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the cross-repo merge needs real merge-base objects,
          # a shallow clone would fabricate conflicts.
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install assets merge driver
        run: |
          # .gitattributes routes module/*/assets.py to this driver; without
          # the config the attribute is a no-op and every sync conflict-bombs
          # (39 files on the first run).
          git config merge.alas-assets.driver \
            "python3 dev_tools/merge_assets_driver.py %O %A %B"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/LmeSzinc/AzurLaneAutoScript.git
          git fetch upstream master

      - name: Merge upstream/master (auto-push when clean)
        id: merge
        run: |
          if git merge --no-edit upstream/master; then
            git push origin master
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR on conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=sync-upstream/upstream-master
          git checkout -B "$BRANCH" upstream/master
          git push origin "$BRANCH" --force
          gh pr create --base master --head "$BRANCH" \
            --title "Sync upstream: LmeSzinc/master（冲突，需人工合并）" \
            --body "每周自动同步在 merge 时遇到冲突，已把 upstream/master 推成本分支。请本地 merge 解决冲突后合并本 PR。" \
            || echo "PR already open — nothing to do"
